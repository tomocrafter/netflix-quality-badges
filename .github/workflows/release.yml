name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: cd dist/extension && zip -r "../../netflix-quality-badges-${GITHUB_REF_NAME}.zip" .
      - run: gh release create "$GITHUB_REF_NAME" netflix-quality-badges-*.zip dist/netflix-quality-badges.user.js --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
